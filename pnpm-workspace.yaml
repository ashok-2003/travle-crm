packages:
  - "apps/*"
  - "packages/*"

# One version of each shared tool across the repo. Packages refer to these as "catalog:".
catalog:
  typescript: 6.0.3
  "@types/node": 24.19.2
  vitest: 5.0.4
  eslint: 10.12.0
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  zod: 4.6.7
  pino: 10.3.1
  pino-abstract-transport: 3.0.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # The one agent's tool loop (ADR 0008: packages/integrations alone imports them). Never "latest": the next majors move fast.
  "@langchain/core": 1.3.3
  "@langchain/langgraph": 1.6.0

# pnpm 12 refuses to run install scripts unless approved here.
# Prisma and esbuild need theirs; the others come in through testcontainers and are not needed.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  # next-intl's message extractor, which the web app doesn't run; both ship prebuilt binaries.
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.8"
  - "@turbo/darwin-arm64@2.11.8"
  - "@turbo/linux-64@2.11.8"
  - "@turbo/linux-arm64@2.11.8"
  - "@turbo/windows-64@2.11.8"
  - "@turbo/windows-arm64@2.11.8"
  - turbo@2.11.8
  - "@testcontainers/postgresql@12.2.1"
  - testcontainers@12.2.1

# tRPC's packages ship "agent skills" for AI coding tools; we don't install them.
permissions:
  "@trpc/server":
    skills: false
  "@trpc/client":
    skills: false
  "@trpc/tanstack-react-query":
    skills: false

# The dependency audit (`pnpm audit --audit-level=high`, a CI gate, ADR 0027). Each fix names its advisory: remove it
# once the package that holds the old version moves past it.
overrides:
  # GHSA-3f6p-5ww8-9rcr: Prisma's CLI holds mysql2 3.15.3, for a database we don't use.
  "prisma>mysql2": 3.24.5
  # GHSA-ggr8-5vv4-36mx: Prisma's config loader holds deepmerge-ts 7.1.5; it merges only our own prisma.config.ts.
  "@prisma/config>deepmerge-ts": 8.0.2
  # GHSA-xjj6-f33q-929c: undici 8.0 to 8.12.1 (a dependency of jsdom, testcontainers and others) dies on a response with too many
  # content-encodings. Only our tests and tools reach it, but the fix is a patch release.
  "undici@>=8.0.0 <8.12.2": 8.12.2
  # Not a fix: LangChain's core takes langsmith >=0.11.0 <1.0.0, and its newest, 0.12.0, was a week old when LangChain came
  # in (2026-11-17). 0.11.7 is two weeks old, as every version we pin is. LangSmith never runs: the tool agent turns its
  # tracing off.
  "@langchain/core>langsmith": 0.11.7
  # Not a fix: LangGraph's platform client (which we never use) takes react-dom as an optional peer, and the catalog's
  # react-dom would otherwise be installed with it in the api's image (7.8 MB).
  "@langchain/langgraph-sdk>react-dom": "-"
auditConfig:
  ignoreGhsas:
    # braces has no fixed version. Only ESLint's Next.js plugin reaches it, globbing patterns from our own config.
    - GHSA-vfj7-8cjw-p6xm
    # picomatch has no fixed version (2026-11-18). Only ESLint's Next.js plugin reaches it (through fast-glob), matching
    # globs from our own config, never user input.
    - GHSA-fc5q-39xc-vjpf
