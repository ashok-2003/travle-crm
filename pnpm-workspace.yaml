packages:
  - "apps/*"
  - "packages/*"

# One version of each shared tool across the repo. Packages refer to these as "catalog:".
catalog:
  typescript: 6.0.3
  "@types/node": 24.19.2
  vitest: 5.0.4
  eslint: 10.12.0
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  zod: 4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

# pnpm 12 refuses to run install scripts unless approved here.
# Prisma and esbuild need theirs; the others come in through testcontainers and are not needed.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  # next-intl's message extractor, which the web app doesn't run; both ship prebuilt binaries.
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.8"
  - "@turbo/darwin-arm64@2.11.8"
  - "@turbo/linux-64@2.11.8"
  - "@turbo/linux-arm64@2.11.8"
  - "@turbo/windows-64@2.11.8"
  - "@turbo/windows-arm64@2.11.8"
  - turbo@2.11.8
  - "@testcontainers/postgresql@12.2.1"
  - testcontainers@12.2.1

# tRPC's packages ship "agent skills" for AI coding tools; we don't install them.
permissions:
  "@trpc/server":
    skills: false
  "@trpc/client":
    skills: false
  "@trpc/tanstack-react-query":
    skills: false
