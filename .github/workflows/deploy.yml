# Releases main to the Oracle servers (docs/runbook.md, "Our own database"): scripts/server/release-servers.sh builds
# the api's image on this runner and releases it to the app server, which applies the migrations itself, then to the
# database server when what that one runs has changed. The runner is the api server's architecture, so the image
# builds natively: x86_64, or arm64 when the repository variable ORACLE_API_SERVER_ARCH says `arm64` (an Ampere A1).
# It runs only where the owner has turned it on (the repository variable ORACLE_DEPLOY_ENABLED), never for a pull
# request, and one at a time. A merge that changes only the web app (Vercel deploys it) or the docs releases nothing.
# The deploy key is the repository secret ORACLE_DEPLOY_SSH_KEY: the deploy needs no environment.
name: Deploy to Oracle

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to release (a rollback is the commit before)
        required: true
        default: main

permissions:
  contents: read

# Never two releases at once, and never one cut short: a later one waits its turn.
concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to the servers
    if: vars.ORACLE_DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.ORACLE_API_SERVER_ARCH == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The deploy key and the servers' host keys; a host key that isn't the one recorded stops the run. One connection
      # per server serves every command of the run, rather than a new one (and its round trips to Mumbai) for each.
      - name: SSH to the servers
        run: |
          install -d -m 0700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/oracle-deploy)
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ServerAliveInterval 30\n  ControlMaster auto\n  ControlPath ~/.ssh/control-%%C\n  ControlPersist 5m\n' >~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ORACLE_KNOWN_HOSTS }}
      - name: Release
        run: SSH_KEY="$HOME/.ssh/oracle-deploy" scripts/server/release-servers.sh "$(git rev-parse HEAD)"
        env:
          API_SERVER: ${{ vars.ORACLE_API_SERVER }}
          CONSOLE_SERVER: ${{ vars.ORACLE_CONSOLE_SERVER }}
